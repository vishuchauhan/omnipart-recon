<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniPart RECON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: engineering-drawing workbench. Fixed left nav of 13 views, a summary-first main canvas,
   part numbers in mono, one cobalt accent, status carried by chips and severity stripes. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --ink:#18202c; --muted:#5b6678; --line:#dde2ea; --accent:#2350d8;
  --accent-soft:#e6ecfd; --ok:#1f8a56; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fdf1dc;
  --bad:#c23a32; --bad-soft:#fbe6e4; --idle:#6f7a8c; --idle-soft:#eceff4;
  --display:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c; --surface:#171e29; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3443; --accent:#7f9dff;
  --accent-soft:#1f2b4d; --ok:#4cc38a; --ok-soft:#173327; --warn:#f0b54d; --warn-soft:#3a2c12;
  --bad:#ff7b72; --bad-soft:#3d1d1c; --idle:#8d98aa; --idle-soft:#232c3a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#171e29; --ink:#e7ecf3; --muted:#9aa6b8; --line:#2a3443; --accent:#7f9dff;
  --accent-soft:#1f2b4d; --ok:#4cc38a; --ok-soft:#173327; --warn:#f0b54d; --warn-soft:#3a2c12;
  --bad:#ff7b72; --bad-soft:#3d1d1c; --idle:#8d98aa; --idle-soft:#232c3a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:700 17px/1.2 var(--display);letter-spacing:-.01em;padding:0 8px 2px}
.brand small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:4px}
.navgroup{margin-top:16px}
.navgroup h6{margin:0 8px 6px;font:600 10.5px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
nav a{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px}
nav a:hover{background:var(--idle-soft)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav a .n{font:500 10.5px var(--mono);color:var(--muted);width:18px}
.badge-syn{margin:16px 8px 0;font:500 11px var(--body);color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 8px}
main{padding:24px 28px 60px;min-width:0}
h1{font:700 24px/1.2 var(--display);margin:0 0 4px;letter-spacing:-.015em;text-wrap:balance}
h2{font:600 16px/1.3 var(--display);margin:0 0 10px;text-wrap:balance}
h3{font:600 13.5px/1.3 var(--display);margin:0 0 6px}
.lede{color:var(--muted);max-width:72ch;margin:0 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .lab{font-size:12px;color:var(--muted)}
.kpi .val{font:600 22px/1.2 var(--display);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font:500 11.5px var(--body);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}.c-idle{background:var(--idle-soft);color:var(--idle)}.c-acc{background:var(--accent-soft);color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
td.mono,.mono{white-space:nowrap}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--idle-soft)}
.scroll{overflow-x:auto}
button,.btn{font:500 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.good{background:var(--ok);border-color:var(--ok);color:#fff}
button.danger{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:13px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.stripe{border-left:3px solid var(--line);padding-left:10px}
.stripe.bad{border-color:var(--bad)}.stripe.warn{border-color:var(--warn)}.stripe.ok{border-color:var(--ok)}.stripe.acc{border-color:var(--accent)}
.record{border:1px dashed var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.record .sys{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.record .pn{font:600 18px var(--mono);margin:6px 0 2px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.vs .q{font:700 22px var(--display);color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--idle-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.steps{counter-reset:s;display:grid;gap:14px}
.step{position:relative;padding-left:40px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px/28px var(--display);text-align:center}
svg text{fill:var(--muted);font:11px var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.drawer{position:fixed;top:0;right:0;width:min(560px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.12);padding:20px;overflow:auto;z-index:20;display:none}
.drawer.open{display:block}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--idle-soft);border-radius:10px;padding:8px;min-height:240px}
.col h4{margin:2px 4px 8px;font:600 12px var(--body);display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--accent)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab}
.kcard .t{font:600 12.5px var(--body)}
.kcard .m{font-size:11.5px;color:var(--muted);margin-top:4px}
pre.msg{white-space:pre-wrap;font:12.5px/1.55 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;max-height:420px;overflow:auto}
.eco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.eco .layer{border-radius:10px;padding:12px;border:1px solid var(--line)}
.eco .wf{grid-column:1/-1;background:var(--accent-soft);border-color:transparent}
.formula{font:13px/1.6 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;display:none;z-index:30}
.heat td{text-align:center;font:500 11px var(--mono);padding:5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
@media (max-width:980px){.app{grid-template-columns:1fr}nav{position:static;height:auto}.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.vs{grid-template-columns:1fr}.vs .q{display:none}main{padding:18px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- presentation ---------- */
.deck{position:relative;background:#0b0f16;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.deck img{display:block;width:100%;height:auto;aspect-ratio:1376/768;object-fit:contain;cursor:pointer;user-select:none}
.deck .hit{position:absolute;top:0;bottom:0;width:22%;cursor:pointer}
.deck .hit.l{left:0}.deck .hit.r{right:0}
.deckbar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.deckbar .count{font:600 14px var(--mono, monospace);color:var(--muted);min-width:64px;text-align:center}
.thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.thumbs img{width:120px;border-radius:6px;border:2px solid transparent;cursor:pointer;opacity:.7}
.thumbs img.on{border-color:var(--accent);opacity:1}
.deck:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0;background:#000}
.deck:fullscreen img{width:100vw;height:100vh;aspect-ratio:auto}
.deck:-webkit-full-screen{display:flex;align-items:center;justify-content:center;background:#000}
.deck:-webkit-full-screen img{width:100vw;height:100vh}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Views">
  <div class="brand">OmniPart RECON<small>BOM-TO-SPEND EVIDENCE LAYER</small></div>
  <div id="navlinks"></div>
  <div class="badge-syn" id="srcbadge">Synthetic demo data: fictional company, planted cases, answer key used only on the Proof view.</div>
</nav>
<main id="view" tabindex="-1"></main>
</div>
<aside class="drawer" id="drawer" aria-label="Evidence passport"></aside>
<div class="toast" id="toast" role="status"></div>
<script id="bundle" type="application/json">__BUNDLE__</script>
<script id="slides" type="application/json">__SLIDES__</script>
<script>
const D = JSON.parse(document.getElementById('bundle').textContent);
let API = false;   /* true when served by the local FastAPI server */
if (['localhost','127.0.0.1'].includes(location.hostname)) fetch('/api/health').then(r => r.json()).then(h => { API = true; API_INFO = h; render(); }).catch(() => {});
let API_INFO = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K = v => Math.abs(v) >= 1e6 ? '$' + (v/1e6).toFixed(2) + 'M' : Math.abs(v) >= 1000 ? '$' + (v/1000).toFixed(1) + 'K' : '$' + Math.round(v).toLocaleString();
const R = r => `${K(r.p10)}–${K(r.p90)}`;
const pct = v => (v*100).toFixed(1) + '%';
const num = v => Math.round(v).toLocaleString();
const partDesc = Object.fromEntries(D.parts.map(p => [p.eng_part_id, p.description]));
const LINK = Object.fromEntries(D.links.map(l => [l.sku, l]));

/* ---------- state: link decisions and card states (kept in this browser only) ---------- */
let S = {link:{}, card:{}};
try { S = JSON.parse(localStorage.getItem('recon-state')) || S; } catch(e) {}
const save = () => { try { localStorage.setItem('recon-state', JSON.stringify(S)); } catch(e) {} };
const linkState = l => S.link[l.sku] || l.state;
const cardState = c => S.card[c.id] || c.state;
function setLink(sku, st){
  S.link[sku] = st;
  D.cards.filter(c => c.type === 'VERIFY_LINK' && c.sku === sku).forEach(c => S.card[c.id] = st === 'Verified' ? 'Verified' : st === 'Rejected' ? 'Rejected' : 'Proposed');
  save(); toast(`${sku}: ${st.toLowerCase()}`); render();
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 1800); }

/* ---------- live money: part prices and product cost from active links ---------- */
function activeLinks(){ const m = {}; D.links.forEach(l => { if (l.part && linkState(l) !== 'Rejected') m[l.sku] = l.part; }); return m; }
function nameOnlyLinks(){ const m = {}; D.links.forEach(l => { if (l.name_only_part) m[l.sku] = l.name_only_part; }); return m; }
function partPrices(links){ const v = {}, q = {}; for (const [s, j] of Object.entries(links)) { v[j] = (v[j]||0) + D.qty12[s]*LINK[s].price; q[j] = (q[j]||0) + D.qty12[s]; } const out = {}; for (const j in v) if (q[j] > 0) out[j] = v[j]/q[j]; return out; }
function productCosts(){
  const pb = partPrices(nameOnlyLinks()), pa = partPrices(activeLinks());
  return D.products.map(p => { const lines = D.bom.filter(b => b.product_id === p.product_id);
    const cb = lines.reduce((s, b) => s + b.qty_per_unit*(pb[b.eng_part_id]||0), 0);
    const ca = lines.reduce((s, b) => s + b.qty_per_unit*(pa[b.eng_part_id]||0), 0);
    return {...p, lines, cb, ca, units: D.units12[p.product_id], unpriced: lines.filter(b => !(b.eng_part_id in pa)).map(b => b.eng_part_id)}; });
}
function liveAttributed(){ return productCosts().reduce((s, p) => s + (p.ca - p.cb)*p.units, 0); }
function coverage(){ const tot = D.kpis.total_spend_12m; const lk = D.links.filter(l => l.part && linkState(l) !== 'Rejected').reduce((s, l) => s + l.spend12, 0); return tot > 0 ? lk/tot : D.links.filter(l => l.part && linkState(l) !== 'Rejected').length / Math.max(1, D.links.length); }

/* ---------- charts (SVG, one scale, labelled from theme tokens) ---------- */
const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v/p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10)*p; };
const win3 = a => a.slice(2).map((_, i) => a[i] + a[i+1] + a[i+2]);
function lineChart(series, labels, {h=260, w=900, yfmt=num, title=''}={}){
  const W = w, H = h, L = 58, Rr = 36, T = 12, B = 30;
  const all = series.flatMap(s => s.data.filter(v => v != null && isFinite(v)));
  if (!all.length || labels.length < 2) return '<div class="muted" style="padding:20px 0">Not enough monthly history to draw this chart.</div>';
  let lo = Math.min(0, ...all), hi = Math.max(...all); if (hi === lo) hi = lo + 1; hi = nice(hi*1.05);
  const x = i => L + i*(W-L-Rr)/Math.max(1, labels.length-1), y = v => T + (H-T-B)*(1 - (v-lo)/(hi-lo));
  const ticks = 4, g = [];
  for (let k = 0; k <= ticks; k++){ const v = lo + (hi-lo)*k/ticks; g.push(`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${yfmt(v)}</text>`); }
  const step = Math.ceil(labels.length/8);
  labels.forEach((l, i) => { if (i % step === 0) g.push(`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(l)}</text>`); });
  const paths = series.map(s => { const pts = s.data.map((v, i) => v == null ? null : `${x(i)},${y(v)}`).filter(Boolean);
    return `<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} points="${pts.join(' ')}"/>` +
      (s.dots ? s.data.map((v, i) => v == null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}"/>`).join('') : ''); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g.join('')}${paths.join('')}</svg>` +
    `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function rangeBars(items, {fmt=K}={}){
  const max = Math.max(...items.map(i => i.p90 || i.value || 0), 1);
  return `<div class="grid" style="gap:12px">${items.map(i => `<div><div class="spread"><span>${esc(i.label)}</span><span class="mono">${i.p10 != null ? fmt(i.p10)+'–'+fmt(i.p90) : fmt(i.value)}</span></div>
    <div style="position:relative;height:12px;background:var(--idle-soft);border-radius:6px;margin-top:5px">
      ${i.p10 != null ? `<div style="position:absolute;left:${i.p10/max*100}%;width:${Math.max((i.p90-i.p10)/max*100, .6)}%;top:0;bottom:0;background:${i.color||'var(--bad)'};opacity:.35;border-radius:6px"></div>
      <div style="position:absolute;left:${i.p50/max*100}%;top:-2px;bottom:-2px;width:3px;background:${i.color||'var(--bad)'};border-radius:2px"></div>` :
      `<div style="width:${i.value/max*100}%;height:100%;background:${i.color||'var(--idle)'};border-radius:6px"></div>`}
    </div></div>`).join('')}</div>`;
}

/* ---------- money ladder: indicative -> qualified -> approved -> realized ---------- */
const LADDER = [['Indicative','Proposed or assigned: model output, not yet reviewed'],['Qualified','In review by the owner'],['Approved','Signed off by the owner'],['Realized','Measured after the action is executed']];
function ladder(){
  const sum = st => D.cards.filter(c => !(c.type==='STANDARDIZATION' && c.rng.p50 <= 0) && st.includes(cardState(c))).reduce((a, c) => a + Math.max(0, c.rng.p50), 0);
  const v = [sum(['Proposed','Assigned']), sum(['In review']), sum(['Verified']), null];
  return `<div class="grid g4" style="gap:8px">${LADDER.map(([n, d], i) => `<div class="stripe ${['warn','acc','ok',''][i]}" style="padding:4px 10px"><div class="lab" style="font-size:12px;color:var(--muted)">${i+1}. ${n}</div><div style="font:600 18px var(--display)">${v[i]==null?'not tracked yet':K(v[i])}</div><div class="muted" style="font-size:11.5px">${d}</div></div>`).join('')}</div>
  <p class="muted" style="font-size:12px;margin:8px 0 0">P50 of spend involved per item. Move cards on the resolution board to promote dollars up the ladder. Nothing is a saving until it is realized.</p>`;
}
const CAPS = D.readiness ? D.readiness.capabilities : {};
const SIG = D.readiness && D.readiness.behavior_signal;
function readinessBanner(){
  const miss = Object.entries({behavior_matching:'behavior matching', reconciliation:'reconciliation', spend_amounts:'spend amounts'}).filter(([k]) => CAPS[k] === false).map(([, v]) => v);
  const weak = SIG && SIG.verdict === 'weak';
  if (!miss.length && !weak) return '';
  return `<div class="card stripe warn" style="margin-bottom:14px"><b>Data readiness:</b> ${miss.length ? 'not available with the files provided: ' + miss.join(', ') + '. ' : ''}${weak ? 'Behavior evidence is weak on this data (self-check ' + SIG.strength.toFixed(2) + '): RECON relies on names and leaves the rest unresolved. ' : ''}<a href="#data">See what each file unlocks</a>.</div>`;
}
/* ---------- small helpers ---------- */
const chipFor = (st, ev) => {
  st = st || ''; if (st === 'Verified') return '<span class="chip c-ok">Verified</span>';
  if (st === 'Rejected') return '<span class="chip c-bad">Rejected</span>';
  if (st === 'Unresolved') return '<span class="chip c-idle">Unresolved</span>';
  if (ev === 'Hidden link') return '<span class="chip c-acc">Proposed · hidden link</span>';
  if (ev === 'Look-alike (twin)') return '<span class="chip c-warn">Proposed · look-alike</span>';
  if (ev === 'Signals disagree') return '<span class="chip c-bad">Proposed · signals disagree</span>';
  return '<span class="chip c-warn">Proposed</span>';
};
const bandTxt = l => l.band_precision ? `${l.band}: ${Math.round(l.band_precision[0]*100)}% correct (95% CI ${Math.round(l.band_precision[1]*100)}–${Math.round(l.band_precision[2]*100)}%, n=${l.band_precision[3]})` : '–';
const sc = v => v == null ? 'n/a' : v.toFixed(2);

/* ---------- views ---------- */
const VIEWS = [
  ['Foundation (Track 3)', [['overview','Overview'],['motor','The mystery motor'],['links','Link map'],['reconcile','Reconciliation'],['integrity','Spend integrity'],['cost','True product cost']]],
  ['Standardization (Track 1)', [['standard','Standardization']]],
  ['Workflow', [['board','Resolution board'],['comms','Communications']]],
  ['Trust', [['proof','Proof'],['data','Data & backflush'],['method','Methodology']]],
  ['Customer value (Track 2)', [['roadmap','Roadmap']]],
  ['Pitch', [['present','Presentation']]],
];

function openPassport(sku){

  if (l.best_name_part && l.best_name_part !== l.part && D.expected[l.best_name_part].some(v => v > 0)) series.push({name:`Expected, ${l.best_name_part} (best name match)`, data:win3(D.expected[l.best_name_part]), color:'var(--idle)'});
  const rows = [

    ${lineChart(series, labels, {h:300, w:640, title:'Purchased vs expected'})}
    <table style="margin-top:12px"><tbody>${rows.map(([a, b]) => `<tr><th style="width:36%;text-transform:none;letter-spacing:0;font-size:12.5px">${a}</th><td>${b}</td></tr>`).join('')}</tbody></table>

let proofSet = 'B';
const SETLAB = {A:'Development', B:'Blind test', C:'Unfamiliar company', U:'Your upload'};
V.proof = () => {
  if (!D.benchmark[proofSet]) proofSet = Object.keys(D.proof_sets)[0];
  const bm = D.benchmark[proofSet], hard = D.benchmark['hard_' + proofSet], seg = D.benchmark['segments_' + proofSet], cal = D.calibration[proofSet];
  const errs = (D.benchmark['errors_' + proofSet] || []).filter(e => e.method === 'RECON' || e.method === 'Name only');
  const sig = (D.proof_signals || {})[proofSet];
  const methods = ['Name only','Behavior only','RECON'], col = {'Name only':'var(--idle)','Behavior only':'var(--warn)','RECON':'var(--accent)'};
  const stress = D.stress; const months = [6,12,18,24], noises = [0,0.05,0.1,0.2];
  const wins = months.flatMap(m => noises.map(n => { const g = mm => stress.find(s => s.months===m && s.noise===n && s.method===mm).f1; return g('RECON') >= g('Name only') - 1e-9; }));
  return `<h1>Proof</h1><p class="lede">Matching scored against the answer key. Company A (${esc(D.proof_company)}) is where thresholds were tuned. Company B (${esc(D.blind_company)}) is a blind test: different seed and new description vocabulary, settings frozen. Source: ${esc(D.proof_source)}.</p>
  <div class="tabs">${Object.entries(D.proof_sets).sort((a, b) => 'BCAU'.indexOf(a[0]) - 'BCAU'.indexOf(b[0])).map(([k, n]) => `<button class="${proofSet===k?'on':''}" onclick="proofSet='${k}';render()">${SETLAB[k]||k} · ${esc(n)}</button>`).join('')}</div>
  ${sig ? `<div class="card stripe ${sig.verdict==='strong'?'ok':sig.verdict==='moderate'?'warn':'bad'}" style="margin-bottom:14px"><b>Behavior self-check on this dataset: ${esc(sig.verdict)}${sig.strength!=null?' ('+sig.strength.toFixed(2)+')':''}.</b> ${esc(sig.note||'')} <span class="muted">Measured without the answer key, from links whose names are already clear.</span></div>` : ''}
  ${proofSet==='C' ? `<p class="lede" style="margin-top:-4px">Procedurally generated manufacturer the method never saw: different products, parts, BOMs, supplier naming and lumpier purchasing. Settings frozen. This is the honest answer to "what if we gave you a stranger's data?"</p>` : ''}
  <div class="grid g3">${bm.map(b => `<div class="card stripe ${b.method==='RECON'?'acc':''}"><h3>${b.method}</h3><div class="grid g3" style="gap:6px">
    <div class="kpi"><div class="lab">Precision</div><div class="val">${(b.precision*100).toFixed(0)}%</div></div><div class="kpi"><div class="lab">Recall</div><div class="val">${(b.recall*100).toFixed(0)}%</div></div><div class="kpi"><div class="lab">F1</div><div class="val">${b.f1.toFixed(2)}</div></div></div>
    <div class="muted" style="margin-top:6px">${b.correct_links} correct · ${b.false_links} false link${b.false_links===1?'':'s'} · ${b.missed} missed · ${b.traps_linked} trap${b.traps_linked===1?'':'s'} linked</div></div>`).join('')}</div>
  <div class="grid g2" style="margin-top:14px"><div class="card scroll"><h2>Hard cases</h2><table><thead><tr><th>SKU</th>${methods.map(m => `<th>${m}</th>`).join('')}</tr></thead><tbody>
    ${Object.entries(hard).map(([s, r]) => `<tr><td class="mono">${s}</td>${methods.map(m => `<td><span class="chip ${r[m].startsWith('OK')?'c-ok':r[m].startsWith('MISS')?'c-idle':'c-bad'}">${esc(r[m])}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="card scroll"><h2>Results by segment (correct / n)</h2><table><thead><tr><th>Segment</th>${methods.map(m => `<th class="r">${m}</th>`).join('')}</tr></thead><tbody>
    ${[...new Set(seg.map(s => s.segment))].map(g => `<tr><td>${g}</td>${methods.map(m => { const x = seg.find(s => s.segment===g && s.method===m); return `<td class="r mono">${x.correct}/${x.n}</td>`; }).join('')}</tr>`).join('')}</tbody></table>
    <h2 style="margin-top:16px">Calibration of proposed links (Wilson 95%)</h2><table><thead><tr><th>Score band</th><th class="r">n</th><th class="r">Correct</th><th class="r">95% interval</th></tr></thead><tbody>
    ${cal.map(c => `<tr><td>${c.band}</td><td class="r mono">${c.n}</td><td class="r mono">${c.n?Math.round(c.precision*100)+'%':'–'}</td><td class="r mono">${c.n?Math.round(c.lo*100)+'–'+Math.round(c.hi*100)+'%':'–'}</td></tr>`).join('')}</tbody></table>
    <p class="muted" style="font-size:12px">Small samples give wide intervals. A pilot with a verified crosswalk is needed to calibrate on real data.</p></div></div>
  <div class="card scroll" style="margin-top:14px"><h2>Every error, name-only vs RECON</h2>${errs.length ? `<table><thead><tr><th>Method</th><th>SKU</th><th>Purchasing description</th><th>True part</th><th>Result</th></tr></thead><tbody>${errs.map(e => `<tr><td>${e.method}</td><td class="mono">${e.sku}</td><td>${esc(e.description)}</td><td class="mono">${e.truth}</td><td><span class="chip ${e.kind.startsWith('missed')?'c-idle':'c-bad'}">${esc(e.kind)}${e.predicted?' → '+e.predicted:''}</span></td></tr>`).join('')}</tbody></table>` : '<p class="muted">No errors on this dataset.</p>'}
  <p class="muted" style="font-size:12px">A miss leaves spend unresolved for review. A false link would put the wrong cost on a product, so RECON is tuned to prefer misses.</p></div>

    <div class="grid g4">${months.map(m => `<div><h3>${m} months of history</h3>${lineChart(methods.map(mm => ({name:mm, data:noises.map(n => stress.find(s => s.months===m && s.noise===n && s.method===mm).f1), color:col[mm], w:mm==='RECON'?3:2, dots:true})), noises.map(n => (n*100)+'%'), {h:230, w:360, yfmt:v => v.toFixed(1), title:`F1 at ${m} months`})}</div>`).join('')}</div></div>`;
};

V.method = () => `<h1>Methodology</h1><p class="lede">Plain language first, formulas below. Thresholds were tuned on synthetic company A and frozen for the blind test; real deployments recalibrate them in a pilot.</p>
  <div class="grid g2">
  <div class="card"><h2>1. Expected demand</h2><div class="formula">Expected(j, t) = Σᵢ BOM_qty(i, j) × units_built(i, t)</div><p>Every engineering part gets a monthly pattern from the products that use it. Parts shared across products get the combined pattern.</p></div>
  <div class="card"><h2>2. Name signal</h2><div class="formula">name = 0.75 × TF-IDF cosine (character 2–4-grams)
     + 0.25 × spec-number overlap (Jaccard)</div><p>Descriptions are cleaned and abbreviations expanded (HX → hex, BRG → bearing) before comparison.</p></div>
  <div class="card"><h2>3. Behavior signal</h2><div class="formula">P̃, Ẽ = rolling 3-month totals of Purchased, Expected
shape = max(0, ½·corr(P̃, Ẽ) + ½·corr(ΔP̃, ΔẼ))
behavior = shape² × volume plausibility
null if &lt; 6 windows, zero variance, or &lt; 3 non-zero windows</div><p>Month-to-month changes work like a fingerprint; levels alone would match anything that grows. Negative correlation is clipped to zero before squaring.</p></div>
  <div class="card"><h2>4. Volume plausibility against remaining demand</h2><div class="formula">target(s, j) = max(0, 1 − Σ shares of other name-led SKUs on j)
r = (share + 0.05) ÷ (target + 0.05)
level = 1 if 0.75 ≤ r ≤ 1.33, else exp(−2.5 × |ln(r ÷ clip)|)</div><p>A 5% backup supplier fits a part that is 95% covered. A SKU claiming demand that another supplier already covers is penalized.</p></div>
  <div class="card"><h2>5. Decision cascade</h2><div class="formula">1  name ≥ 0.55 and margin ≥ 0.08          → proposed (name-led)
2  repeat, most certain first: behavior ≥ 0.45
   and margin ≥ 0.15 (weak name)          → proposed (hidden link)
3  0.45·name + 0.55·behavior ≥ 0.55       → proposed (combined)
   otherwise                              → unresolved</div><p>Look-alike twins (raw behavior within 0.05, name ≥ 0.4) are flagged for verification. Only a person moves a link to verified. Rejections are never proposed again.</p></div>
  <div class="card"><h2>6. Confidence</h2><div class="formula">Wilson: (p + z²/2n ± z·√(p(1−p)/n + z²/4n²)) ÷ (1 + z²/n)
Stability: block bootstrap over months (B = 300, block = 3)
Implied usage: NNLS on count intervals, bootstrap 90% CI
Money: P10–P90 from resampled periods</div></div>
  <div class="card"><h2>7. Count-to-count balance</h2><div class="formula">Observed use = Counted₀ + Purchased − Counted₁
ratio = Observed use ÷ Expected
shift: best mean split, |after − before| ≥ 0.20
excess: median ≥ 1.04 in ≥ 75% of recent intervals
inventory build: spike &gt; 3× median, ΔCounted explains ≥ 90%</div></div>
  <div class="card"><h2>9. Behavior self-check (no answer key needed)</h2><div class="formula">strength = median shape(SKU, part) over links whose name match is clear
strong ≥ 0.70 · moderate ≥ 0.55 · weak below</div><p>Tells you, on any new dataset, whether purchases follow production closely enough for hidden-link rescue. When weak, RECON relies on names and leaves the rest unresolved.</p></div>
  <div class="card"><h2>8. Money language</h2><p><b>Spend newly attributed to BOMs</b> is cost that was invisible, not a saving. <b>Price gaps</b> use the lowest observed price as a benchmark. <b>Standardization</b> nets spec-upgrade and qualification costs. Integrity buckets never double-count.</p></div>
  <div class="card stripe warn" style="grid-column:1/-1"><h2>Limitations</h2><ul>
    <li>Parts with the same footprint (same products, same quantity per unit) have identical demand patterns. Behavior is evidence of a relationship, not proof of identity.</li>
    <li>Needs monthly production volumes, receipts and physical counts; about 12 months of history or more. With 6 months the behavior signal switches off.</li>
    <li>Thresholds were tuned on synthetic data. Calibration bands are wide at these sample sizes. A pilot with a held-back verified crosswalk is required.</li>
    <li>Variances are investigation leads. Returns, transfers, rework and substitutions must be inside the stock boundary or they surface as unexplained.</li></ul></div>
  </div>`;

V.roadmap = () => `<h1>Customer value · Track 2 roadmap</h1><p class="lede">Not built. Once part identity is trusted, customer signals can attach to the same components and decide what a platform should standardize and what it should keep different.</p>
  <div class="grid g3">
  <div class="card stripe acc"><h3>Link warranty and service records to parts</h3><p>Warranty claims and spare-part consumption already arrive as spend; with verified links they land on specific components and suppliers.</p></div>
  <div class="card stripe acc"><h3>Attach customer feedback to features</h3><p>Reviews, service notes and returns are tagged to features, then to the components that deliver them.</p></div>
  <div class="card stripe acc"><h3>Value-versus-cost view</h3><p>Components customers notice and value stay as differentiated modules; the ones they never notice are standardization candidates.</p></div></div>
  <div class="card" style="margin-top:14px"><h2>How it plugs into the ecosystem</h2><p>Foundation (Track 3) gives each component a trusted identity and true cost. Standardization (Track 1) proposes merges. Customer value (Track 2) checks each merge against what customers care about. The resolution board routes all three to the same owners, and every decision improves the shared part graph.</p></div>`;

/* ---------- presentation (slides from the pitch deck) ---------- */
let SLIDES = [];
try { SLIDES = JSON.parse(document.getElementById('slides').textContent); } catch (e) { SLIDES = []; }
let slideIx = 0;
V.present = () => {
  if (!SLIDES.length) return `<h1>Presentation</h1><div class="card"><p>No slides were bundled with this build.</p></div>`;
  slideIx = Math.max(0, Math.min(slideIx, SLIDES.length - 1));
  return `<div class="deck" id="deck"><img id="slideimg" src="${SLIDES[slideIx]}" alt="Slide ${slideIx+1} of ${SLIDES.length}">
    <div class="hit l" onclick="slideGo(-1)" title="Previous"></div><div class="hit r" onclick="slideGo(1)" title="Next"></div></div>
  <div class="deckbar"><button onclick="slideGo(-1)" aria-label="Previous slide">&larr; Back</button>
    <span class="count" id="slidecount">${slideIx+1} / ${SLIDES.length}</span>
    <button class="primary" onclick="slideGo(1)" aria-label="Next slide">Next &rarr;</button>
    <button onclick="deckFull()">Full screen</button>
    <a class="btn" href="#overview" style="margin-left:auto">Go to product &rarr;</a></div>
  <div class="thumbs" id="thumbs">${SLIDES.map((s, i) => `<img src="${s}" class="${i===slideIx?'on':''}" onclick="slideTo(${i})" alt="Slide ${i+1}">`).join('')}</div>
  <p class="muted" style="font-size:12px;margin-top:8px">Arrow keys, Space or a presentation clicker move between slides. F = full screen, Esc = exit. Click "Go to product" (or any menu item) to start the demo.</p>`;
};
function slideTo(i){
  slideIx = Math.max(0, Math.min(i, SLIDES.length - 1));
  const img = $('#slideimg'); if (!img) return;
  img.src = SLIDES[slideIx]; img.alt = `Slide ${slideIx+1} of ${SLIDES.length}`;
  $('#slidecount').textContent = `${slideIx+1} / ${SLIDES.length}`;
  document.querySelectorAll('#thumbs img').forEach((t, k) => t.classList.toggle('on', k === slideIx));
}
function slideGo(d){ slideTo(slideIx + d); }
function deckFull(){ const el = $('#deck'); if (!el) return;
  if (document.fullscreenElement) document.exitFullscreen(); else (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
document.addEventListener('keydown', e => {
  if (location.hash !== '#present' || /INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) return;
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); slideGo(1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); slideGo(-1); }
  else if (e.key === 'Home') slideTo(0);
  else if (e.key === 'End') slideTo(SLIDES.length - 1);
  else if (e.key === 'f' || e.key === 'F') deckFull();
});

function render(){
  const id = (location.hash || '#overview').slice(1); const cur = V[id] ? id : 'overview';
  $('#navlinks').innerHTML = navHTML(cur);
  if (!D.planted.length) $('#srcbadge').textContent = 'Uploaded data. The Proof view shows the demo answer-key results.';
  $('#view').innerHTML = V[cur]();
}
window.addEventListener('hashchange', () => { closePassport(); render(); window.scrollTo(0,0); });
render();
</script>
